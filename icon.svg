<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#2f5a45"/><stop offset="1" stop-color="#10241b"/>
    </radialGradient>
    <linearGradient id="mug" x1="0" x2="1">
      <stop offset="0" stop-color="#a3202f"/><stop offset="0.55" stop-color="#c8333f"/><stop offset="1" stop-color="#7e1623"/>
    </linearGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b0f1d"/><stop offset="1" stop-color="#3d0710"/>
    </linearGradient>
    <clipPath id="cane"><path d="M318 150 L318 70 A34 34 0 0 1 386 70 L386 82" fill="none"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- snow dots -->
  <g fill="#ffffff" opacity="0.55">
    <circle cx="70" cy="80" r="6"/><circle cx="140" cy="40" r="4"/><circle cx="440" cy="60" r="5"/><circle cx="460" cy="170" r="4"/>
    <circle cx="50" cy="200" r="4"/><circle cx="96" cy="140" r="3"/><circle cx="420" cy="120" r="3"/><circle cx="200" cy="70" r="3"/>
  </g>
  <!-- star -->
  <path d="M120 96 l9 20 22 2 -17 14 5 21 -19 -11 -19 11 5 -21 -17 -14 22 -2z" fill="#f2c14e"/>
  <!-- steam -->
  <g fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.8">
    <path d="M200 190 c-18 -24 18 -40 0 -66"/>
    <path d="M250 182 c-18 -24 18 -40 0 -66"/>
  </g>
  <!-- handle -->
  <path d="M352 260 h26 a46 46 0 0 1 0 92 h-26" fill="none" stroke="#8f1d2c" stroke-width="26"/>
  <!-- mug body -->
  <path d="M120 230 h248 v130 a62 62 0 0 1 -62 62 h-124 a62 62 0 0 1 -62 -62z" fill="url(#mug)"/>
  <!-- rim + wine -->
  <ellipse cx="244" cy="230" rx="124" ry="22" fill="#e9ecea"/>
  <ellipse cx="244" cy="232" rx="110" ry="15" fill="url(#wine)"/>
  <!-- orange slice -->
  <circle cx="190" cy="226" r="24" fill="#f39a2b"/><circle cx="190" cy="226" r="17" fill="#ffc163"/>
  <g stroke="#f39a2b" stroke-width="2.5"><line x1="190" y1="209" x2="190" y2="243"/><line x1="173" y1="226" x2="207" y2="226"/><line x1="178" y1="214" x2="202" y2="238"/><line x1="202" y1="214" x2="178" y2="238"/></g>
  <!-- candy cane -->
  <g>
    <path d="M300 236 L300 120 A34 34 0 0 1 368 120 L368 140" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
    <path d="M300 236 L300 120 A34 34 0 0 1 368 120 L368 140" fill="none" stroke="#d62839" stroke-width="22" stroke-linecap="butt" stroke-dasharray="14 14"/>
  </g>
  <!-- rim front edge over cane -->
  <path d="M120 230 a124 22 0 0 0 248 0" fill="none" stroke="#e9ecea" stroke-width="6"/>
  <!-- snowflake decor on mug -->
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.9">
    <line x1="244" y1="290" x2="244" y2="372"/><line x1="208" y1="310" x2="280" y2="352"/><line x1="208" y1="352" x2="280" y2="310"/>
  </g>
  <!-- shine -->
  <path d="M146 262 v86" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.25"/>
</svg>
