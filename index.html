<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zunfthaus-Rechner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zunfthaus-Rechner">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1d2b24">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: 0; }

/* Layout: one-screen till. Price tiles in a grid, a fixed bottom bar with the running total. Summary and history are full views swapped in place. */
:root {
  --bg: #f3f5f2;
  --surface: #ffffff;
  --ink: #17231d;
  --muted: #5d6b63;
  --line: #d9e0db;
  --wine: #8f1d2c;
  --wine-ink: #ffffff;
  --wine-soft: #f6e4e6;
  --gold: #b7851f;
  --pfand: #1f6b52;
  --pfand-soft: #e1f0ea;
  --bar: #1d2b24;
  --bar-ink: #f3f5f2;
  --display: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111914; --surface: #1b261f; --ink: #eef2ee; --muted: #9aa8a0; --line: #2c3a32;
    --wine: #b8303f; --wine-ink: #ffffff; --wine-soft: #3a1c21; --gold: #e0b14a;
    --pfand: #3fa580; --pfand-soft: #183229; --bar: #0a100c; --bar-ink: #eef2ee;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111914; --surface: #1b261f; --ink: #eef2ee; --muted: #9aa8a0; --line: #2c3a32;
  --wine: #b8303f; --wine-ink: #ffffff; --wine-soft: #3a1c21; --gold: #e0b14a;
  --pfand: #3fa580; --pfand-soft: #183229; --bar: #0a100c; --bar-ink: #eef2ee;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px;
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  overscroll-behavior-y: none;
  font-variant-numeric: tabular-nums;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.wrap {
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 10px 120px; max-width: 1100px; margin: 0 auto;
}
@media (min-width: 420px) { .wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); } }
header.top { display: flex; align-items: center; gap: 8px; padding-bottom: 8px; }
header.top .logo { width: 40px; height: 40px; border-radius: 10px; flex: none; }
header.top .ttl { flex: 1; min-width: 0; }
.tbtn { height: 44px; padding: 0 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; font-size: 0.9rem; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.tbtn:disabled { opacity: 0.4; }
.tbtn .ic { font-size: 1.15rem; line-height: 1; }
@media (max-width: 419px) { #undoBtn .lbl { display: none; } .tbtn { padding: 0 13px; } }
h1 { font-family: var(--display); font-weight: 800; font-size: 1.15rem; line-height: 1.1; margin: 0; letter-spacing: -0.01em; }
.pfandnote { color: var(--muted); font-size: 0.75rem; display: block; }

/* tiles: 3 columns on phones so every drink fits on one screen, 4 on tablets */
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 600px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; }
.tile.has { border-color: var(--wine); box-shadow: 0 0 0 1px var(--wine) inset; }
.add { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 9px 9px 8px; text-align: left; min-height: 100px; background: var(--wine); color: var(--wine-ink); width: 100%; }
.add:active { filter: brightness(1.15); transform: scale(0.98); }
.add .icons { font-size: 1.35rem; line-height: 1; }
.add .name { font-weight: 700; font-size: 0.82rem; line-height: 1.2; text-wrap: balance; hyphens: manual; }
.add .price { font-family: var(--display); font-weight: 800; font-size: 1.2rem; margin-top: auto; }
.ctl { display: flex; align-items: center; justify-content: space-between; padding: 5px; gap: 4px; }
.count { font-family: var(--display); font-weight: 800; font-size: 1.6rem; min-width: 2ch; text-align: center; flex: 1; }
.count.zero { color: var(--muted); opacity: 0.45; }
.count.bump { animation: bump 0.22s ease-out; }
@keyframes bump { 0% { transform: scale(1.45); } 100% { transform: scale(1); } }
.minus { width: 48px; height: 42px; border-radius: 10px; background: var(--wine-soft); color: var(--wine); font-size: 1.7rem; font-weight: 700; line-height: 1; }
@media (min-width: 600px) {
  .add { padding: 12px 12px 10px; min-height: 120px; gap: 4px; }
  .add .icons { font-size: 1.7rem; }
  .add .name { font-size: 1.02rem; }
  .add .price { font-size: 1.5rem; }
  .count { font-size: 1.9rem; }
  .minus { width: 56px; height: 48px; font-size: 1.9rem; }
}
.minus:disabled { opacity: 0.35; }
.tile.pfand .add { background: var(--pfand); }
.tile.pfand.has { border-color: var(--pfand); box-shadow: 0 0 0 1px var(--pfand) inset; }
.tile.pfand .minus { background: var(--pfand-soft); color: var(--pfand); }

.tile.mini .add { background: var(--surface); color: var(--ink); min-height: 0; }
.tile.mini .add .name { font-size: 0.78rem; }
.tile.mini .add .name { font-weight: 600; }
.tile.mini .add .sub { font-size: 0.72rem; color: var(--muted); margin-top: auto; }
.tile.mini .add .price { margin-top: 0; }
.tile > .add { flex: 1; }
.add .nw { white-space: nowrap; }
@media (max-width: 599px) { #t-rum .add .name { font-size: 0.72rem; letter-spacing: -0.01em; } }
.tile.mini .add .price { color: var(--gold); }
.tile.mini { border-style: dashed; }
.tile.mini.has { border-style: solid; border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
.tile.mini .ctl { border-top: 1px solid var(--line); }
.tile.mini .minus { background: var(--bg); color: var(--ink); }
@media (min-width: 600px) { .tile.mini .add { min-height: 120px; } .tile.mini .add .name { font-size: 1.02rem; } }

/* bottom bar */
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--bar); color: var(--bar-ink);
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
}
.bar-in { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.bar .tot { flex: 1; min-width: 0; }
.bar .tot small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.72rem; opacity: 0.7; letter-spacing: 0.06em; text-transform: uppercase; }
.bar .tot b { white-space: nowrap; font-family: var(--display); font-size: clamp(1.4rem, 7vw, 1.9rem); font-weight: 800; }
.btn { height: 56px; padding: 0 12px; white-space: nowrap; border-radius: 14px; font-weight: 700; font-size: 1rem; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn-ghost { background: rgba(255,255,255,0.08); color: var(--bar-ink); border: 1px solid rgba(255,255,255,0.18); }
.btn-ghost.armed { background: var(--wine); border-color: var(--wine); }
.btn-main { background: var(--gold); color: #1a1204; padding: 0 16px; font-size: 1.1rem; }
.btn-main:disabled { opacity: 0.4; }
.iconbtn { width: 48px; height: 48px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); font-size: 1.3rem; }

/* summary + history views */
.view { max-width: 720px; margin: 0 auto; }
.bigsum { text-align: center; padding: 18px 0 10px; }
.bigsum small { display: block; color: var(--muted); font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; }
.bigsum .amount { font-family: var(--display); font-weight: 800; font-size: clamp(4rem, 22vw, 8rem); line-height: 1; letter-spacing: -0.03em; margin-top: 6px; }
.bigsum.payout .amount { color: var(--pfand); }
.lines { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 4px 14px; margin-top: 12px; }
.line { display: grid; grid-template-columns: 3.2ch minmax(0, 1fr) auto; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); align-items: baseline; font-size: 1.05rem; }
.line:last-child { border-bottom: 0; }
.line .q { font-weight: 800; font-family: var(--display); }
.line .n { min-width: 0; }
.line .n span { display: block; color: var(--muted); font-size: 0.8rem; }
.line .a { font-weight: 700; text-align: right; }
.line.neg .a { color: var(--pfand); }
.change { margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.change .lbl { font-size: 0.8rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.chip { height: 46px; min-width: 64px; padding: 0 14px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); font-weight: 700; font-size: 1.05rem; }
.chip.exact { min-width: auto; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.given-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.given-row label { font-size: 0.9rem; color: var(--muted); font-weight: 600; white-space: nowrap; }
.given-field { flex: 1; min-width: 0; display: flex; align-items: center; height: 52px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); padding: 0 12px; gap: 6px; }
.given-field:focus-within { border-color: var(--gold); }
.given-field input { flex: 1; min-width: 0; width: 100%; border: 0; background: transparent; color: var(--ink); font: 800 1.5rem var(--display); outline: none; text-align: right; user-select: text; -webkit-user-select: text; }
.given-field span { font: 800 1.3rem var(--display); color: var(--muted); }
.change .res .short { color: var(--wine); }
.change .res { margin-top: 10px; font-size: 1.15rem; min-height: 1.4em; }
.change .res b { font-family: var(--display); font-size: 1.7rem; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.actions .full { grid-column: 1 / -1; }
.abtn { height: 62px; border-radius: 14px; font-weight: 700; font-size: 1.05rem; background: var(--surface); border: 1px solid var(--line); }
.abtn.primary { background: var(--wine); color: var(--wine-ink); border-color: var(--wine); font-size: 1.2rem; }
.viewhead { display: flex; align-items: center; gap: 10px; padding: 4px 0 10px; }
.viewhead h2 { font-family: var(--display); font-weight: 800; font-size: clamp(1.1rem, 5vw, 1.4rem); margin: 0; flex: 1; min-width: 0; }
.viewhead .iconbtn { flex: none; }
.today { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.today b { font-family: var(--display); font-size: 1.4rem; }
.today small { display: block; color: var(--muted); font-size: 0.78rem; }
.hist { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.hitem { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.hitem .h1 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.hitem .time { color: var(--muted); font-size: 0.88rem; }
.hitem .sum { font-family: var(--display); font-weight: 800; font-size: 1.35rem; }
.hitem .items { margin-top: 4px; font-size: 0.92rem; line-height: 1.45; }
.hitem .edit { margin-top: 8px; height: 40px; padding: 0 14px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); font-weight: 600; }
.empty { color: var(--muted); text-align: center; padding: 30px 10px; }
.editing { background: var(--wine-soft); color: var(--wine); border-radius: 12px; padding: 8px 12px; font-size: 0.88rem; font-weight: 600; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.editing button { height: 36px; padding: 0 12px; border-radius: 10px; background: var(--wine); color: var(--wine-ink); font-weight: 700; }
.cups { margin-top: 10px; color: var(--muted); font-size: 0.9rem; text-align: center; }
.danger { height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--wine); color: var(--wine); background: var(--surface); font-weight: 700; white-space: nowrap; }
.danger:disabled { opacity: 0.35; }
.danger.armed { background: var(--wine); color: var(--wine-ink); border-style: solid; border-color: var(--wine); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } .add:active { transform: none; } }
</style>

</head>

      <div class="lbl">Gegeben</div>

<div id="vHist" hidden>
  <div class="wrap view" style="padding-bottom:24px">
    <div class="viewhead">
      <button class="iconbtn" id="histBack" aria-label="Zurück">‹</button>
      <h2>Letzte Bestellungen</h2>
      <button class="danger" id="histClear">🗑 Historie löschen</button>
    </div>
    <div class="today" id="today"></div>
    <div class="cups">Bestellungen werden nach 48 Stunden automatisch gelöscht.</div>
    <div class="hist" id="histList"></div>
  </div>
</div>

<script>
(function () {
  var PFAND = 450; // Cent
  // Preise in Cent, inkl. Pfand. Gruppen gleicher Preise zusammengefasst.
  var BIG = [
    { id: "gluehwein",icons: "🍷🥚", name: "Glühwein rot · Eierpunsch",     short: "Glühwein / Eierpunsch",price: 950 },
    { id: "heidel",   icons: "🫐",   name: "Heidelbeer-Glühwein",           short: "Heidelbeer",           price: 1000 },
    { id: "zunft",    icons: "🍎",   name: "Zunfttrunk",                    short: "Zunfttrunk",           price: 1050 },
    { id: "rum",      icons: "🍷🥃", name: "GW Rot / Kakao mit Shot",       short: "GW Rot / Kakao mit Shot", price: 1100 },
    { id: "koelsch",  icons: "🍺☕", name: "Kölsch · Kakao",                short: "Kölsch / Kakao",       price: 850 },
    { id: "frucht",   icons: "🍹",   name: "Früchtepunsch",                 short: "Früchtepunsch",        price: 900 },
    { id: "fzb",      icons: "🔥",   name: "Feuerzangenbowle",              short: "Feuerzangenbowle",     price: 1250 },
    { id: "wein",     icons: "🥂",   name: "Wein Graub. · Rot · Rosé",      short: "Wein",                 price: 1300 },
    { id: "pfand",    icons: "↩️",   name: "Pfand zurück",                  short: "Pfand zurück",         price: -PFAND, pfand: true }
  ];
  var SMALL = [
    { id: "limo",  name: "Limo · Wasser · Schorle · Shot", short: "Limo / Wasser / Schorle / Shot", price: 350 },
    { id: "kaugummi", name: "Kaugummi", short: "Kaugummi", price: 380 }
  ];
  var ALL = BIG.concat(SMALL);
  var byId = {}; ALL.forEach(function (p) { byId[p.id] = p; });

  var KEY_CUR = "wmr.current.v1", KEY_HIST = "wmr.history.v1", KEY_EDIT = "wmr.editing.v1";
  function load(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  var counts = load(KEY_CUR, {});
  var history = load(KEY_HIST, []);
  var KEEP_MS = 48 * 60 * 60 * 1000; // Bestellungen älter als 48 Stunden werden automatisch gelöscht
  function prune() {
    var cut = Date.now() - KEEP_MS, n = history.length;
    history = history.filter(function (h) { return h && h.ts >= cut; });
    if (history.length !== n) save(KEY_HIST, history);
  }
  prune();
  var editingId = load(KEY_EDIT, null);
  var given = null;
  var undoStack = []; // Schnappschüsse vor jeder Änderung
  function snap() { undoStack.push(JSON.stringify(counts)); if (undoStack.length > 100) undoStack.shift(); }
  function bump(id) { var c = $("c-" + id); if (!c) return; c.classList.remove("bump"); void c.offsetWidth; c.classList.add("bump"); }

  function eur(c) {
    var neg = c < 0; c = Math.abs(c);
    return (neg ? "−" : "") + Math.floor(c / 100) + "," + String(c % 100).padStart(2, "0") + " €";
  }
  function total(cs) { var t = 0; for (var k in cs) if (byId[k]) t += cs[k] * byId[k].price; return t; }
  function itemCount(cs) { var n = 0; for (var k in cs) n += cs[k]; return n; }
  function buzz() { try { navigator.vibrate && navigator.vibrate(12); } catch (e) {} }
  function $(id) { return document.getElementById(id); }

  // ---------- Kasse ----------
  function buildTiles() {
    var g = $("grid"); g.innerHTML = "";
    BIG.forEach(function (p) {
      var t = document.createElement("div");
      t.className = "tile" + (p.pfand ? " pfand" : ""); t.id = "t-" + p.id;
      t.innerHTML =
        '<button class="add" data-add="' + p.id + '" aria-label="' + p.name + ' hinzufügen">' +
          '<span class="icons" aria-hidden="true">' + p.icons + '</span>' +
          '<span class="name">' + p.name.replace("Feuerzangenbowle", "Feuerzangen&shy;bowle").replace("Heidelbeer-Glühwein", "Heidelbeer-&#8203;Glühwein").replace("Früchtepunsch", "Früchte&shy;punsch").replace("GW Rot / Kakao mit Shot", "<span class=\"nw\">GW Rot /</span> <span class=\"nw\">Kakao mit Shot</span>") + '</span>' +
          '<span class="price">' + eur(p.price) + '</span>' +
        '</button>' +
        '<div class="ctl"><span class="count" id="c-' + p.id + '">0</span>' +
        '<button class="minus" data-sub="' + p.id + '" aria-label="Eins weniger">−</button></div>';
      g.appendChild(t);
    });
    SMALL.forEach(function (p) {
      var t = document.createElement("div");
      t.className = "tile mini"; t.id = "t-" + p.id;
      t.innerHTML =
        '<button class="add" data-add="' + p.id + '" aria-label="' + p.name + ' hinzufügen">' +
          '<span class="name">' + p.name + '</span><span class="sub">ohne Pfand</span>' +
          '<span class="price">' + eur(p.price) + '</span></button>' +
        '<div class="ctl"><span class="count" id="c-' + p.id + '">0</span>' +
        '<button class="minus" data-sub="' + p.id + '" aria-label="Eins weniger">−</button></div>';
      g.appendChild(t);
    });
  }

  function renderMain() {
    ALL.forEach(function (p) {
      var n = counts[p.id] || 0;
      var c = $("c-" + p.id); c.textContent = n; c.classList.toggle("zero", n === 0);
      $("t-" + p.id).classList.toggle("has", n > 0);
      $("t-" + p.id).querySelector(".minus").disabled = n === 0;
    });
    var t = total(counts);
    $("totVal").textContent = eur(t);
    var n = 0; for (var k in counts) if (byId[k] && byId[k].price > 0) n += counts[k];
    $("totLabel").textContent = (t < 0 ? "Auszahlen" : "Summe") + (n ? " · " + n + " Stk." : "");
    $("undoBtn").disabled = undoStack.length === 0;
    $("sumBtn").disabled = itemCount(counts) === 0;
    $("editBanner").hidden = !editingId;
    save(KEY_CUR, counts);
  }

  document.addEventListener("click", function (e) {
    var a = e.target.closest("[data-add]"), s = e.target.closest("[data-sub]");
    if (a) { var id = a.dataset.add; snap(); counts[id] = (counts[id] || 0) + 1; buzz(); disarm(); renderMain(); bump(id); }
    else if (s) { var id2 = s.dataset.sub; if (counts[id2]) { snap(); counts[id2]--; if (!counts[id2]) delete counts[id2]; buzz(); bump(id2); } disarm(); renderMain(); }
  });

  // Zwei-Tipp-Bestätigung für Löschen
  var armTimer = null;
  function arm(btn, label) { btn.classList.add("armed"); btn.dataset.orig = btn.dataset.orig || btn.textContent; btn.textContent = label; clearTimeout(armTimer); armTimer = setTimeout(function(){ disarm(); }, 3000); }
  function disarm() { document.querySelectorAll(".armed").forEach(function (b) { b.classList.remove("armed"); if (b.dataset.orig) b.textContent = b.dataset.orig; }); }

  $("clearBtn").addEventListener("click", function () {
    var b = this;
    if (b.classList.contains("armed")) { snap(); counts = {}; disarm(); renderMain(); buzz(); }
    else if (itemCount(counts) > 0 || editingId) arm(b, "Sicher?");
  });

  $("undoBtn").addEventListener("click", function () {
    if (!undoStack.length) return;
    counts = JSON.parse(undoStack.pop()); disarm(); buzz(); renderMain();
  });
  $("editCancel").addEventListener("click", function () {
    counts = {}; editingId = null; save(KEY_EDIT, null); undoStack = []; renderMain();
  });

  // ---------- Ansichten ----------
  function show(v) {
    $("vMain").hidden = v !== "main"; $("vSum").hidden = v !== "sum"; $("vHist").hidden = v !== "hist";
    window.scrollTo(0, 0);
    if (v === "sum") renderSum(); if (v === "hist") renderHist(); if (v === "main") renderMain();
  }

  function linesHtml(cs) {
    var out = "";
    ALL.forEach(function (p) {
      var n = cs[p.id]; if (!n) return;
      out += '<div class="line' + (p.price < 0 ? " neg" : "") + '"><span class="q">' + n + '×</span>' +
        '<span class="n">' + p.short + '<span>je ' + eur(p.price) + '</span></span>' +
        '<span class="a">' + eur(n * p.price) + '</span></div>';
    });
    return out;
  }

  var CASH = [500, 1000, 2000, 5000, 10000];
  function renderSum() {
    var t = total(counts);
    $("sumAmount").textContent = eur(Math.abs(t));
    $("sumLabel").textContent = t < 0 ? "Auszahlen an Kunde" : "Zu zahlen";
    $("bigsum").classList.toggle("payout", t < 0);
    $("sumLines").innerHTML = linesHtml(counts);
    $("changeBox").hidden = t <= 0;
    var out = 0, back = counts.pfand || 0;
    BIG.forEach(function (p) { if (!p.pfand) out += counts[p.id] || 0; });
    var cupTxt = [];
    if (out) cupTxt.push(out + " Becher raus");
    if (back) cupTxt.push(back + " Becher zurück");
    $("cups").textContent = cupTxt.join(" · ");
    var ch = $("chips"); ch.innerHTML = "";
    var opts = [t].concat(CASH.filter(function (c) { return c > t; }).slice(0, 4));
    opts.forEach(function (c, i) {
      var b = document.createElement("button");
      b.className = "chip" + (i === 0 ? " exact" : "") + (given === c ? " on" : ""); b.textContent = i === 0 ? "Passend" : (c / 100) + " €";
      b.addEventListener("click", function () { given = given === c ? null : c; $("givenInput").value = ""; renderSum(); });
      ch.appendChild(b);
    });
    renderChange();
  }
  function renderChange() {
    var t = total(counts);
    $("changeRes").innerHTML = given == null ? '' : given === t ? 'Kein Rückgeld'
      : given < t ? '<span class="short">Es fehlen noch <b>' + eur(t - given) + '</b></span>'
      : 'Rückgeld: <b>' + eur(given - t) + '</b>';
  }

  function commitOrder() {
    if (itemCount(counts) === 0) return;
    var entry = { id: editingId || String(Date.now()), ts: Date.now(), counts: counts, total: total(counts) };
    if (editingId) {
      var i = history.findIndex(function (h) { return h.id === editingId; });
      if (i >= 0) { entry.ts = history[i].ts; history[i] = entry; } else history.unshift(entry);
    } else history.unshift(entry);
    prune();
    history = history.slice(0, 300);
    save(KEY_HIST, history);
  }

  $("sumBtn").addEventListener("click", function () { if (itemCount(counts)) { given = null; $("givenInput").value = ""; show("sum"); } });
  // Freier Betrag: "70", "70,50" oder "70.5"
  $("givenInput").addEventListener("input", function () {
    var v = this.value.replace(/[^0-9,\.]/g, "").replace(",", ".");
    var n = parseFloat(v);
    given = v === "" || isNaN(n) ? null : Math.round(n * 100);
    document.querySelectorAll("#chips .chip").forEach(function (b) { b.classList.remove("on"); });
    renderChange();
  });
  $("givenInput").addEventListener("keydown", function (e) { if (e.key === "Enter") this.blur(); });
  $("backBtn").addEventListener("click", function () { show("main"); });
  $("newBtn").addEventListener("click", function () {
    commitOrder(); counts = {}; editingId = null; given = null; undoStack = []; save(KEY_EDIT, null); buzz(); show("main");
  });
  $("toHistSum").addEventListener("click", function () { histReturn = "sum"; show("hist"); });
  $("toHistMain").addEventListener("click", function () { histReturn = "main"; show("hist"); });
  var histReturn = "main";
  $("histBack").addEventListener("click", function () { show(histReturn === "sum" && itemCount(counts) ? "sum" : "main"); });

  // ---------- Historie ----------
  function fmtTime(ts) {
    var d = new Date(ts), now = new Date();
    var hm = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    if (d.toDateString() === now.toDateString()) return "Heute, " + hm + " Uhr";
    return d.getDate() + "." + (d.getMonth() + 1) + "., " + hm + " Uhr";
  }
  function itemsText(cs) {
    var parts = [];
    ALL.forEach(function (p) { if (cs[p.id]) parts.push(cs[p.id] + "× " + p.short); });
    return parts.join(", ");
  }
  function renderHist() {
    prune();
    var today = new Date().toDateString();
    var tSum = 0, tN = 0, tCups = 0;
    history.forEach(function (h) {
      if (new Date(h.ts).toDateString() !== today) return;
      tSum += h.total; tN++;
      for (var k in h.counts) if (byId[k] && byId[k].price > 0 && k !== "limo" && k !== "kaugummi") tCups += h.counts[k];
    });
    $("today").innerHTML =
      '<div><small>Heute kassiert</small><b>' + eur(tSum) + '</b></div>' +
      '<div><small>Bestellungen</small><b>' + tN + '</b></div>' +
      '<div><small>Tassengetränke</small><b>' + tCups + '</b></div>';
    $("histClear").disabled = !history.length;
    var L = $("histList"); L.innerHTML = "";
    if (!history.length) { L.innerHTML = '<div class="empty">Noch keine Bestellungen. Nach „Neue Bestellung“ erscheinen sie hier.</div>'; return; }
    history.slice(0, 50).forEach(function (h) {
      var el = document.createElement("div"); el.className = "hitem";
      el.innerHTML = '<div class="h1"><span class="time">' + fmtTime(h.ts) + '</span><span class="sum">' + eur(h.total) + '</span></div>' +
        '<div class="items">' + itemsText(h.counts) + '</div>';
      var b = document.createElement("button"); b.className = "edit"; b.textContent = "Bearbeiten";
      b.addEventListener("click", function () {
        counts = JSON.parse(JSON.stringify(h.counts)); editingId = h.id; save(KEY_EDIT, editingId); undoStack = []; show("main");
      });
      el.appendChild(b); L.appendChild(el);
    });
  }
  $("histClear").addEventListener("click", function () {
    var b = this;
    if (b.classList.contains("armed")) { history = []; save(KEY_HIST, history); disarm(); renderHist(); }
    else if (history.length) arm(b, "Sicher? Tippen");
  });

  // Bildschirm wach halten (wenn erlaubt)
  function wake() { try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(function(){}); } catch (e) {} }
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") wake(); });
  wake();

  buildTiles(); show("main");
})();
</script>
<script>if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); }); }</script>
</body>
